# Ready for GitHub Pages (not yet connected). Runs 9:30 UTC daily (~5:30 AM ET, after West Coast games finish).
name: nightly-refresh
on:
  schedule: [{cron: "30 9 * * *"}]
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: SEASON=${SEASON:-$(date +%Y)} ./run_nightly.sh
        env: {SEASON: "2026"}   # remove once 2027 games begin
      - name: Commit refreshed data (also keeps the cron from going stale)
        run: |
          git config user.name "pip-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/players.json && git commit -m "nightly data $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
